<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nómada Viajes - Contacto y Reserva</title>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/logo_nomada.png" alt="logo empresa Nómada Viajes" width="450">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>  
            <a href="./catalogo.html">
                Paquetes
            </a>
            <a href="./detalle.html">
                Detalle y Carrito
            </a> 
             <a href="./formulario.html">
                Contacto
            </a> 
             <a href="./confirmacion.html">
                Confirmacion
            </a>    
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="formulario-reserva">
            <h2>Completá tus datos para reservar</h2>
            
            <form action="confirmacion.html" method="GET">
                <div>
                    <label for="nombre">Nombre y apellido:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo del pasajero" required>
                </div>
                
                <div>
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" name="dni" placeholder="Documento de identidad" required>
                </div>
                
                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Dirección de email" required>
                </div>
                
                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Número de contacto" required>
                </div>
                
                <div>
                    <label for="destino">Destino de interés:</label>
                    <input type="text" id="destino" name="destino" placeholder="Ej. Bariloche al completo">
                </div>
                
                <div>
                    <label for="fecha">Fecha estimada de viaje:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Comentarios o consultas adicionales"></textarea>
                </div>
                
                <button type="submit">Enviar consulta / Confirmar reserva</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <ul>
            <li>
                <a href="https:/instagram.com/@nomadaviajes_ok" target="_blank">
                    @nomadaviajes_ok
                </a>
            </li>
            <li>
                Contacto: Av. Colón 1234, Córdoba, Argentina  
            </li>
            <li>
                Telefono: (0351) 456-7890
            </li>
            <li>
                Email: info@nomadaviajes.com.ar
            </li>
            <li>
                Preguntas frecuentes — Términos y condiciones — Medios de pago
            </li>                   
        </ul>
    </footer>

</body>
</html>
